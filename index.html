        if (image && image.getAttribute('src') !== product[0]) {
          image.src = product[0];
          image.alt = product[1];
        }
        if (name && name.textContent !== product[1]) name.textContent = product[1];
        card.querySelector('em')?.remove();
        card.querySelector('span')?.remove();
        card.setAttribute('aria-label', product[1]);
      });
    }
    if (!surveyScreen.classList.contains('q15')) return;
    if (surveyScreen.querySelector('.q15-live-copy')) return;
    const layer = document.createElement('div');
    layer.className = 'q15-live-copy';
    layer.innerHTML = productNames.map(([variant]) => `
      <div class="q15-product-name">
        <span class="line-one"><span class="latin">moody +&nbsp;</span><span class="zh">目怡蓝</span></span>
        <span class="line-two">${variant}</span>
      </div>`).join('');
    surveyScreen.appendChild(layer);
  };
  new MutationObserver(ensureQuestion14Copy).observe(surveyScreen, {attributes:true, childList:true});
  ensureQuestion14Copy();
})();
</script>
